services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: test2yc
      MYSQL_USER: test2yc
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-root-me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: test2yc
      DB_USER: test2yc
      DB_PASSWORD: change-me
    ports:
      - "5000:5000"
volumes:
  mysql_data:
